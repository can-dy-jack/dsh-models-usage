<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" role="img" aria-label="Model usage and balance">
  <!-- Two stacked coins: the front one carries the model sparkle, the back one is
       notched by the mask so a ring of space keeps the two outlines apart. -->
  <mask id="dsh-models-usage-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect x="0" y="0" width="24" height="24" fill="#fff"/>
    <circle cx="9" cy="15" r="8.35" fill="#000"/>
  </mask>
  <g stroke="#5B6CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle mask="url(#dsh-models-usage-gap)" cx="15.5" cy="8.5" r="6"/>
    <circle cx="9" cy="15" r="6.25"/>
    <path fill="#5B6CFF" stroke-width="1" d="M9 11.4Q9.45 14.55 12.6 15Q9.45 15.45 9 18.6Q8.55 15.45 5.4 15Q8.55 14.55 9 11.4Z"/>
  </g>
</svg>

# dsh-models-usage bundle patch: inserts the dual-face plugin row into the
# profile roster. The node half (`exports["."]`) runs in the Host process and
# owns model enumeration plus balance queries; the `dsh.client` declaration in
# package.json makes the browser half (`exports["./client"]`) load in the Web GUI.
- insert:
    - id: models-usage
      name: dsh-models-usage
      config: {}
